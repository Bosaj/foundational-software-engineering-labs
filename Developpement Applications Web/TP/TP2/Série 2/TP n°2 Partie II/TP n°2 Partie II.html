<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Voitures</title>
    <style>
      table {
        width: 80%;
        margin: auto;
        border: none;
        border-collapse: collapse;
        margin-top: 20px;
      }

      th,
      td {
        border: none;
        text-align: left;
        padding: 8px;
      }
      td {
        border-top: 1px solid rgb(203, 203, 203);
      }

      th {
        background-color: #f2f2f2;
        border-top: 1px solid rgb(203, 203, 203);
      }

      .delete-button {
        cursor: pointer;
        background-color: #ff3333; /* Red color */
        color: #fff;
        border: none;
        padding: 5px 10px;
        border-radius: 5px;
      }
      form {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-top: 30px;
      }
      button {
        background-color: #007bff;
        color: #fff;
        border: none;
        padding: 5px 15px;
        border-radius: 5px;
        cursor: pointer;
      }
      input {
        padding-right: 60px;
        border: 1px solid rgb(227, 227, 227);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <script src="TP n°2 Partie II.js"></script>
  </body>
</html>
